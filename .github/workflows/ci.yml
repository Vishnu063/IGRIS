{
  "name": "IGRIS prepared validation (manual only)",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Validate definitions and standard-library dependencies",
          "run": "python3 scripts/check_ci.py"
        },
        {
          "name": "Build validation",
          "run": "python3 -m compileall -q src tests"
        },
        {
          "name": "Unit and local integration tests",
          "run": "python3 -m unittest discover -s tests -q"
        },
        {
          "name": "Credential-pattern scan",
          "run": "PYTHONPATH=src python3 -m igris.guardian.scan"
        },
        {
          "name": "Prepare development source artifact",
          "run": "PYTHONPATH=src python3 -m igris.artifacts dist/igris-source.zip"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "igris-development-source",
            "path": "dist/igris-source.zip",
            "retention-days": 1,
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
